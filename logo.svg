<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF451A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF5A36" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Orange rounded squircle card background with soft shadow -->
  <rect x="16" y="16" width="128" height="128" rx="32" ry="32" fill="url(#grad1)" filter="url(#shadow)" />

  <!-- Pure White inner subscription card emblem -->
  <rect x="36" y="50" width="88" height="62" rx="10" ry="10" fill="#FFFFFF" />

  <!-- Coral orange magnetic stripe -->
  <rect x="36" y="62" width="88" height="9" fill="#FF5A36" />

  <!-- Gold security EMV chip -->
  <rect x="46" y="80" width="18" height="20" rx="3" ry="3" fill="#FFD166" />
  <!-- Chip lines -->
  <line x1="46" y1="90" x2="64" y2="90" stroke="#E5B942" stroke-width="1"/>
  <line x1="55" y1="80" x2="55" y2="100" stroke="#E5B942" stroke-width="1"/>

  <!-- Orange recurring arrows emblem -->
  <path d="M96,80 C90.5,80 86,84.5 86,90 C86,92.2 86.8,94.2 88,95.8 L90.5,93.6 C89.6,92.5 89,91.3 89,90 C89,86.1 92.1,83 96,83 C99.9,83 103,86.1 103,90 C103,93.9 99.9,97 96,97 L95,97 L95,100 L96,100 C101.5,100 106,95.5 106,90 C106,84.5 101.5,80 96,80 Z" fill="#FF5A36" />
  <polygon points="88,92 84,98 92,97" fill="#FF5A36" />
</svg>
